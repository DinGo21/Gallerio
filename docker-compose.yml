services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-gallerio}
      DB_USER: ${DB_USER:-gallerio}
      DB_PASS: ${DB_PASS:-gallerio}
    volumes:
      # Curated photos and uploads live on the host and survive rebuilds.
      - ./images:/var/www/html/images:z
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gallerio-root}
      MARIADB_DATABASE: ${DB_NAME:-gallerio}
      MARIADB_USER: ${DB_USER:-gallerio}
      MARIADB_PASSWORD: ${DB_PASS:-gallerio}
    volumes:
      - gallerio_db:/var/lib/mysql
      # schema.sql is idempotent and runs only on first initialisation.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gallerio_db:
