# Gallerio Apache configuration.
#
# index.php and upload.php sit at the project root, which is also the document
# root, so the application internals must be denied explicitly.

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

# Source, database scripts, tests and dev tooling are never public.
<DirectoryMatch "^/var/www/html/(src|database|tests|vendor|docker)(/|$)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(composer\.(json|lock)|phpunit\.xml\.dist|AGENTS\.md|\.gitignore|\.env)$">
    Require all denied
</FilesMatch>
